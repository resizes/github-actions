name: Wiki Sync Apply

on:
  repository_dispatch:
    types: [wiki-sync]

permissions:
  contents: write

jobs:
  apply:
    name: Apply Wiki Updates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4

      - name: Checkout wiki sync scripts
        uses: actions/checkout@v4
        with:
          repository: resizes/github-actions
          ref: main
          path: ${{ runner.temp }}/wiki-sync-scripts
          sparse-checkout: |
            wiki-sync/scripts
          sparse-checkout-cone-mode: false

      - name: Install Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r "${{ runner.temp }}/wiki-sync-scripts/wiki-sync/scripts/requirements.txt"

      - name: Apply wiki updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIKI_SYNC_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 "${{ runner.temp }}/wiki-sync-scripts/wiki-sync/scripts/wiki_sync.py" \
            --docs-dir . \
            --docs-branch main \
            --apply-from-json "$WIKI_SYNC_PAYLOAD"
